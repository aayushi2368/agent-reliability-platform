name: Agent Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run-agent-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate dataset
        run: |
          python scripts/generate_data.py

      - name: Generate task suite
        run: |
          python scripts/generate_suite_v2.py

      - name: Run stable agent suite
        run: |
          python scripts/run_suite.py \
            --suite tasks/suite_v2.jsonl \
            --agent-version ci-stable \
            --llm mockv2 \
            --judge heuristic

      - name: Run CI quality gate
        run: |
          python scripts/ci_check.py \
            --results reports/ci-stable_results.json \
            --min-pass-rate 1.0 \
            --min-judge-score 2.9

      - name: Run repeated flaky check
        run: |
          python scripts/run_repeated_suite.py \
            --suite tasks/suite_v2.jsonl \
            --agent-version ci-flaky \
            --llm flaky \
            --judge heuristic \
            --runs 2 \
            --seed 42

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: reports/